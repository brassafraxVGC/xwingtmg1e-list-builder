<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X-Wing Squad Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #18212b; --muted: #5a6876; --line: #d6dce3;
  --accent: #2b5d8a; --ps: #d9641e; --rebel: #b3272d; --imperial: #3f4f63; --scum: #9a7412;
  --chip: #edf1f5; --hit: #fff2d6; --bad: #c62828; --badbg: #fdecea; --ok: #2e7d32;
  --st-atk: #c62828; --st-agi: #2e7d32; --st-hull: #a77a00; --st-shd: #1f6fb2;
  --tile-h: 300px; --tile-h-phone: 270px; --ctext-size: 13px;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --fac: var(--rebel);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f151c; --surface: #17202a; --ink: #e3e9ef; --muted: #93a2b1; --line: #2a3644;
  --accent: #7fb2e0; --ps: #f08a45; --rebel: #ec6b6f; --imperial: #a8b8cc; --scum: #e0b64a;
  --chip: #1f2a36; --hit: #3a3017; --bad: #ff7676; --badbg: #3a1d1f; --ok: #63d47f; color-scheme: dark;
  --st-atk: #ff7676; --st-agi: #63d47f; --st-hull: #f2c440; --st-shd: #6fb6ff;
} }
body[data-f="i"] { --fac: var(--imperial); } body[data-f="s"] { --fac: var(--scum); }
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input, textarea { font: inherit; color: inherit; }
a, button, select, label { touch-action: manipulation; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 26px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.brand .sub { color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs button { border: 0; background: none; font: 600 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 7px 12px; border-radius: 4px; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--surface); }
.bar1 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fac { display: flex; gap: 4px; }
.fac button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 7px 11px; font: 600 14px/1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.fac button[aria-pressed="true"][data-f="r"] { border-color: var(--rebel); color: var(--rebel); background: var(--surface); box-shadow: inset 0 -3px 0 var(--rebel); }
.fac button[aria-pressed="true"][data-f="i"] { border-color: var(--imperial); color: var(--imperial); background: var(--surface); box-shadow: inset 0 -3px 0 var(--imperial); }
.fac button[aria-pressed="true"][data-f="s"] { border-color: var(--scum); color: var(--scum); background: var(--surface); box-shadow: inset 0 -3px 0 var(--scum); }
.meter { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.meter .num { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.meter .num small { font: 500 13px var(--f-mono); color: var(--muted); }
.meter.over .num { color: var(--bad); }
.meter .track { width: 90px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--fac); }
.meter.over .track i { background: var(--bad); }
.status { font: 600 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .07em; padding: 4px 7px; border-radius: 3px; }
.status.ok { background: var(--chip); color: var(--ok); }
.status.bad { background: var(--badbg); color: var(--bad); border: 0; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 6px 11px; font-weight: 500; font-size: 13px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
@media (hover: hover) { .btn:not(:disabled):hover { border-color: var(--accent); } }

main .wrap { padding-block: 16px 64px; display: flex; flex-direction: column; gap: 12px; }
.sqmeta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.sqmeta input#sqname { flex: 1 1 260px; min-width: 0; font: 700 24px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; border: 0; border-bottom: 1px dashed var(--line); background: none; padding: 4px 0; }
.sqmeta input#sqname::placeholder { color: var(--muted); opacity: .6; }
.sqmeta label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.sqmeta select, .sqmeta input[type=number] { padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.sqmeta input[type=number] { width: 66px; }
.problems { background: var(--badbg); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); border-radius: 6px; padding: 8px 12px; color: var(--ink); font-size: 13px; }
.problems b { color: var(--bad); font: 600 13px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; }
.problems ul { margin: 4px 0 0; padding-left: 18px; }

.shipc { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--fac); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.shipc.err { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); border-left-color: var(--bad); }
.sh-h { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.sh-h .skill { font: 700 20px/28px var(--f-display); color: var(--ps); border: 2px solid var(--ps); border-radius: 6px; width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.sh-h .skill sup { font-size: 10px; margin-left: 1px; }
.sh-h .nm { min-width: 0; display: flex; flex-direction: column; }
.sh-h .nm b { font-weight: 600; font-size: 16px; line-height: 1.25; }
.sh-h .nm small { color: var(--muted); font-size: 12.5px; }
.sh-h .tot { font: 600 15px/1 var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.sh-h .tot small { display: block; font: 500 10.5px var(--f-body); color: var(--muted); margin-top: 3px; }
.uniq { color: var(--ps); margin-right: 3px; }
.sh-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.mini { display: flex; gap: 10px; font: 600 15px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.mini span { display: inline-flex; align-items: baseline; gap: 3px; }
.mini i { font: 600 9.5px/1 var(--f-display); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mini .atk { color: var(--st-atk); } .mini .agi { color: var(--st-agi); } .mini .hull { color: var(--st-hull); } .mini .shd { color: var(--st-shd); }
.mini .up { text-decoration: underline 2px; text-underline-offset: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font: 500 11.5px/1 var(--f-body); padding: 4px 6px; border-radius: 3px; background: var(--chip); color: var(--muted); }
.chips span.add { color: var(--accent); }
.ability { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.ic { font: 600 10.5px/1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; padding: 2px 4px; border-radius: 3px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.slot { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 2px 8px; border: 1px dashed var(--line); border-radius: 5px; padding: 6px 4px 6px 9px; min-height: 46px; background: none; text-align: left; justify-items: start; }
.slot .sty { grid-column: 1 / -1; font: 600 10.5px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.slot .snm { font-weight: 500; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.slot .sc { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.slot .sc s { opacity: .6; margin-right: 3px; }
.slot.open .snm { color: var(--accent); font-weight: 500; }
.slot.full { border-style: solid; background: var(--chip); }
.slot.bad { border-color: var(--bad); background: var(--badbg); }
.slot.linked { opacity: .7; }
.slot .x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; width: 30px; height: 30px; border-radius: 4px; }
@media (hover: hover) { .slot.pick:hover { border-color: var(--accent); } .slot .x:hover { color: var(--bad); background: var(--surface); } }
.slot.pick { cursor: pointer; }
.shiperr { margin: 0; padding-left: 18px; font-size: 13px; color: var(--bad); }
.sh-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.sh-acts .btn { font-size: 12.5px; padding: 4px 9px; background: var(--surface); }
.addship { border: 2px dashed var(--line); background: none; border-radius: 6px; padding: 16px; font: 600 17px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
@media (hover: hover) { .addship:hover { border-color: var(--accent); } }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; }
.foot { color: var(--muted); font-size: 12px; max-width: 75ch; }

.scrim { position: fixed; inset: 0; background: rgba(8,12,16,.45); z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; }
.sheet { background: var(--surface); border-radius: 8px; width: min(760px, 100%); max-height: calc(100dvh - 48px); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); overflow: hidden; }
.sheet-h { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sheet-h .row { display: flex; align-items: center; gap: 10px; }
.sheet-h h2 { margin: 0; font: 700 21px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; flex: 1; min-width: 0; }
.sheet-h h2 small { display: block; font: 500 12.5px var(--f-body); text-transform: none; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
.closex { border: 0; background: var(--chip); border-radius: 4px; width: 34px; height: 34px; font-size: 20px; line-height: 1; }
.sheet-h input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.shipchips { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.shipchips button { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 4px 10px; font-size: 12.5px; white-space: nowrap; }
.shipchips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sheet-b { overflow-y: auto; overscroll-behavior: contain; padding: 6px 0 10px; }
.grp { font: 600 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 14px 4px; display: flex; justify-content: space-between; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 14px; align-items: start; }
.opt:first-child { border-top: 0; }
.opt .skill { font: 700 16px/24px var(--f-display); color: var(--ps); border: 1.5px solid var(--ps); border-radius: 4px; width: 28px; text-align: center; }
.opt .on { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt .on b { font-weight: 600; }
.opt .on .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.opt .on .tags span { font: 600 10.5px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; padding: 3px 5px; border-radius: 3px; background: var(--chip); color: var(--muted); }
.opt .on p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.opt .oc { font: 600 13px var(--f-mono); background: var(--chip); border-radius: 4px; padding: 4px 7px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt .why { color: var(--bad); font-size: 12.5px; font-weight: 500; }
.opt.no { cursor: default; }
.opt.no .on b, .opt.no .oc, .opt.no .skill { opacity: .55; }
.opt.cur { background: var(--hit); }
@media (hover: hover) { .opt:not(.no):hover { background: var(--chip); } }
.more { margin: 10px 14px 0; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 7px 12px; font-size: 13px; }
.sheet-f { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.dlg textarea, .dlg input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 8px 10px; font: 12.5px/1.45 var(--f-mono); }
.dlg textarea { min-height: 170px; resize: vertical; }
.dlg .seg { display: flex; gap: 4px; }
.dlg .seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 6px 12px; font-size: 13px; }
.dlg .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.dlg .note { margin: 0; color: var(--muted); font-size: 12.5px; }
.dlg .msg { margin: 0; font-size: 13px; }
.dlg .msg.bad { color: var(--bad); }
.saved { display: flex; flex-direction: column; }
.saved .sv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.saved .sv:first-child { border-top: 0; }
.saved .sv b { font-weight: 600; }
.saved .sv small { color: var(--muted); font-size: 12px; grid-column: 1; }
.saved .sv .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }
.fname { font: 600 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; }
.fname.r { color: var(--rebel); } .fname.i { color: var(--imperial); } .fname.s { color: var(--scum); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 10px 9px 14px; border-radius: 6px; display: flex; gap: 12px; align-items: center; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13.5px; max-width: calc(100% - 32px); }
.toast button { border: 0; background: none; color: var(--surface); font-weight: 600; text-decoration: underline; padding: 4px 6px; }

.sphead { display: flex; flex-direction: column; gap: 4px; }
.sphead h2 { margin: 0; font: 700 32px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
.sphead .kick { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.pts { font: 500 12px var(--f-mono); color: var(--muted); }
.shipblock { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.shipblock h3 { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 700 21px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.shipblock h3 small { font: 500 13px var(--f-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.shipblock h3 .tot { margin-left: auto; font: 500 12.5px var(--f-mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); grid-auto-rows: var(--tile-h); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; min-width: 0; height: 100%; overflow: hidden; }
.card > * { flex-shrink: 0; }
.card > .ctext, .card > .nocard { flex: 1 1 0; min-height: 0; overflow: hidden; }
.card > .ctext.scroll { overflow-y: auto; overscroll-behavior: contain; }
.card.pilot { border-top: 4px solid var(--fac); }
.ctop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.ctop .skill { font: 700 22px/30px var(--f-display); color: var(--ps); border: 2px solid var(--ps); border-radius: 6px; width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.ctop .cname { display: flex; flex-direction: column; min-width: 0; }
.ctop .cname b { font-weight: 600; font-size: 15px; line-height: 1.25; }
.ctop .cname small { color: var(--muted); font-size: 12px; }
.cost { font: 600 13px/1 var(--f-mono); color: var(--ink); background: var(--chip); border-radius: 4px; padding: 5px 7px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.st { display: flex; flex-direction: column; align-items: center; border-radius: 5px; padding: 3px 0 4px; background: var(--chip); }
.st b { font: 700 19px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.st i { font: 600 9.5px/1 var(--f-display); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.st.atk b { color: var(--st-atk); } .st.agi b { color: var(--st-agi); } .st.hull b { color: var(--st-hull); } .st.shd b { color: var(--st-shd); }
.st.mod { background: var(--hit); }
.chips.slotchips span { background: none; border: 1px dashed var(--line); }
.ctext { margin: 0; font-size: var(--ctext-size); line-height: 1.42; }
.utop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.utype { font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.utype .side { color: var(--accent); }
.card.ucard b.uname { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
.wpn { display: flex; gap: 10px; font: 500 12px var(--f-mono); color: var(--muted); }
.wpn b { color: var(--st-atk); }
.nocard { color: var(--muted); font-size: 12.5px; font-style: italic; }
.card.ucard.flipside { border-style: dashed; }
.cost.flip { background: none; border: 1px dashed var(--line); color: var(--muted); font-weight: 500; }
.card.cond { border-top: 4px solid var(--ps); background: linear-gradient(var(--hit), var(--surface) 60px); }
.cost.src { max-width: 55%; overflow: hidden; text-overflow: ellipsis; font: 500 11px/1 var(--f-body); color: var(--muted); }
.dial { background: #12161b; color: #eef2f5; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-width: 0; height: 100%; overflow: hidden; }
.dial .dt { font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: #9aa6b2; }
.dial table { border-collapse: collapse; margin: auto; }
.dial td { width: 30px; height: 28px; text-align: center; padding: 0; }
.dial td.sp { width: 22px; font: 700 15px/1 var(--f-display); color: #9aa6b2; }
.dial svg { width: 24px; height: 24px; display: block; margin: 0 auto; }
.dial .W { color: #f4f6f8; } .dial .G { color: #3fd16f; } .dial .R { color: #ff5b5b; }
.dial .key { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: #9aa6b2; }

@media (max-width: 640px) {
  body { font-size: 15px; }
  header.top { top: calc(env(safe-area-inset-top, 0px) - 34px); }
  .top .wrap { gap: 8px; }
  .brand { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; }
  .brand h1 { font-size: 20px; height: 24px; line-height: 24px; white-space: nowrap; }
  .brand .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

:2,"t":"When defending, if there is at least 1 other friendly Resistance ship at Range 1-2 of the attacker, you may add one <span class=\"ic\">Focus<\/span> result to your roll.","r":"2017-12-08","sh":["bsf17bomber"]},{"i":349,"n":"Deflective Plating","x":"deflectiveplating","sl":"mod","c":1,"t":"When a friendly bomb token detonates, you may choose not to suffer its effects. If you do, roll an attack die. on a <span class=\"ic\">Hit<\/span> result, discard this card.","r":"2017-12-08","sh":["bsf17bomber"]},{"i":350,"n":"Debris Gambit","x":"debrisgambit","sl":"ept","c":2,"t":"<strong>Action:<\/strong> Assign 1 evade token to your ship for each obstacle at Range 1, to a maximum of 2 evade tokens.","r":"2017-12-08","z":["small"]},{"i":351,"n":"Threat Tracker","x":"threattracker","sl":"tech","c":3,"t":"When an enemy ship inside your firing arc at Range 1-2 becomes the active ship during the Combat phase, you may spend your target lock on that ship to perform a free boost or barrel roll action if that action is on your action bar.","r":"2017-12-08","z":["small"]},{"i":352,"n":"Scrambler Missiles","x":"scramblermissiles","sl":"missile","c":2,"t":"<strong>Attack (target lock):<\/strong> Discard this card to perform this attack.<br><br>If this attack hits, the defender and each other ship at Range 1 receive 1 jam token. Then cancel <strong>all<\/strong> results.","r":"2017-12-08","atk":3,"rng":"2-3"},{"i":353,"n":"R5-TK","x":"r5tk","sl":"samd","c":0,"t":"You can acquire target locks on friendly ships.<br><br>You can attack friendly ships.","r":"2017-12-08","u":1},{"i":354,"n":"Targeting Scrambler","x":"targetingscrambler","sl":"system","c":0,"t":"At the start of the Planning phase, you may receive a weapons disabled token to choose a ship at Range 1-3 and assign it the \"Scrambled\" Condition.","r":"2018-06-21","u":1,"cond":["Scrambled"]},{"i":355,"n":"Saw Gerrera","x":"sawgerrera","sl":"crew","c":1,"t":"When attacking, you may suffer 1 damage to change all of your <span class=\"ic\">Focus<\/span> results to <span class=\"ic\">Critical Hit<\/span> results.","r":"2018-06-21","u":1,"f":"r"},{"i":356,"n":"Director Krennic","x":"directorkrennic","sl":"crew","c":5,"t":"During setup, before the \"Place Forces\" step, assign the \"Optimized Prototype\" Condition to a friendly Galactic Empire ship with 3 or fewer shields.","r":"2018-06-21","u":1,"cond":["Optimized Prototype"],"f":"i"},{"i":357,"n":"Death Troopers","x":"deathtroopers","sl":"crew","c":2,"t":"After another friendly ship at Range 1 becomes the defender, if you are inside the attacker's firing arc at Range 1-3, the attacker receives 1 stress token.","r":"2018-06-21","u":1,"f":"i"},{"i":358,"n":"Magva Yarro","x":"magvayarro","sl":"crew","c":2,"t":"After defending, you may acquire a target lock on the attacker.","r":"2018-06-21","u":1,"f":"r"},{"i":359,"n":"Renegade Refit","x":"renegaderefit","sl":"torpedo","c":-2,"t":"You may equip up to 2 different Modification upgrades.<br><br>The squad point cost of your equipped <span class=\"ic\">Elite<\/span> upgrades is reduced by 1 (to a minimum of 0).","r":"2018-06-21","sh":["uwing","xwing"]},{"i":360,"n":"Servomotor S-foils (Attack)","x":"servomotorsfoils","sl":"mod","c":0,"t":"Your action bar gains <span class=\"ic\">Barrel Roll<\/span>.<br><br>If you are not stressed, when you reveal a (<span class=\"ic\">Turn Left<\/span> 3) or (3 <span class=\"ic\">Turn Right<\/span>) maneuver, you may treat it as a red (<span class=\"ic\">Tallon Roll Left<\/span> 3) or (<span class=\"ic\">Tallon Roll Right<\/span> 3) in the same direction.<br><br>At the start of the Activation phase, you may flip this card.","r":"2018-06-21","dual":361,"sh":["xwing"],"gr":[{"type":"action","name":"Barrel Roll"}]},{"i":361,"n":"Servomotor S-foils (Closed)","x":"servomotorsfoils","sl":"mod","c":0,"t":"Reduce your primary attack value by 1. Your action bar gains <span class=\"ic\">Boost<\/span>. Treat your (<span class=\"ic\">Bank Left<\/span> 2) and (<span class=\"ic\">Bank Right<\/span> 2) maneuvers as green.<br><br>At the start of the Activation phase, you may flip this card.","r":"2018-06-21","dual":360,"sh":["xwing"],"gr":[{"type":"action","name":"Boost"}]},{"i":362,"n":"Advanced Ailerons","x":"advancedailerons","sl":"title","c":0,"t":"Treat your (<span class=\"ic\">Bank Left<\/span> 3) and (<span class=\"ic\">Bank Right<\/span> 3) maneuvers as white.<br><br>Immediately before you reveal your dial, if you are not stressed, you must execute a white (<span class=\"ic\">Bank Left<\/span> 1), (<span class=\"ic\">Straight<\/span> 1), or (<span class=\"ic\">Bank Right<\/span> 1) maneuver.","r":"2018-06-21","sh":["tiereaper"]},{"i":363,"n":"Tactical Officer","x":"tacticalofficer","sl":"crew","c":2,"t":"Your action bar gains <span class=\"ic\">Coordinate<\/span>.","r":"2018-06-21","f":"i"},{"i":364,"n":"ISB Slicer","x":"isbslicer","sl":"crew","c":2,"t":"After you perform a jam action against an enemy ship, you may choose a ship at Range 1 of that ship that is not jammed and assign it 1 jam token.","r":"2018-06-21","f":"i"},{"i":365,"n":"Multi-spectral Camouflage","x":"multispectralcamouflage","sl":"mod","c":1,"t":"After you receive a red target lock token, if you have only 1 red target lock token, roll 1 defense die. On an <span class=\"ic\">Evade<\/span> result, remove 1 red target lock token.","r":"2018-06-21","u":1,"z":["small"]},{"i":366,"n":"Thrust Corrector","x":"thrustcorrector","sl":"system","c":1,"t":"When defending, if you have 3 or fewer stress tokens, you may receive 1 stress token to cancel all of your dice results. If you do, add 1 <span class=\"ic\">Evade<\/span> result to your roll. Your dice cannot be modified again during this attack. You can equip this Upgrade only if your hull value is \"4\" or lower.","r":"2018-06-21"}],"conds":{"I'll Show You the Dark Side":{"t":"When this card is assigned, if it is not already in play, the player who assigned it searches the Damage deck for 1 Damage card with the <strong>Pilot<\/strong> trait and may place it faceup on this card. Then shuffle the damage deck.<br><br>When you suffer critical damage during an attack, you are instead dealt the chosen faceup Damage card.<br><br>When there is no Damage card on this card, remove it.","u":1},"Fanatical Devotion":{"t":"When defending, you cannot spend focus tokens.<br><br>When attacking, if you spend a focus token to change all <span class=\"ic\">Focus<\/span> results to <span class=\"ic\">Hit<\/span> results, set aside the first <span class=\"ic\">Focus<\/span> result that you change. The set-aside <span class=\"ic\">Hit<\/span> result cannot be canceled by defense dice, but the defender may cancel <span class=\"ic\">Critical Hit<\/span> results before it.<br><br>During the End phase, remove this card.","u":1},"Suppressive Fire":{"t":"When attacking a ship other than \"Captain Rex,\" roll 1 fewer attack die.<br><br>When you declare an attack targeting \"Captain Rex\" or when \"Captain Rex\" is destroyed, remove this card.<br><br>At the end of the Combat phase, if \"Captain Rex\" did not perform an attack this phase, remove this card.","u":1},"A Debt to Pay":{"t":"When attacking a ship that has the \"A Score to Settle\" Upgrade card, you may change 1 <span class=\"ic\">Focus<\/span> result to a <span class=\"ic\">Critical Hit<\/span> result.","u":1},"Mimicked":{"t":"\"Thweek\" is treated as having your pilot ability.<br><br>\"Thweek\" cannot apply a Condition card by using your pilot ability.<br><br>\"Thweek\" does not lose your pilot ability if you are destroyed.","u":1},"Shadowed":{"t":"\"Thweek\" is treated as having the pilot skill value you had after setup.<br><br>This pilot skill value of \"Thweek\" does not change if your pilot skill value changes or you are destroyed.","u":1},"Harpooned!":{"t":"When you are hit by an attack, if there is at least 1 uncancelled <span class=\"ic\">Critical Hit<\/span> result, each other ship at range 1 suffers 1 damage. Then discard this card and receive one facedown Damage card.<br><br>When you are destroyed, each ship at Range 1 of you suffers 1 damage.<br><br><strong>Action:<\/strong> Discard this card. Then roll 1 attack die. On a <span class=\"ic\">Hit<\/span> or <span class=\"ic\">Critical Hit<\/span> result, suffer 1 damage.","u":0},"Rattled":{"t":"When you suffer damage from a bomb, you suffer 1 additional critical damage. Then, remove this card.<br><br><strong>Action:<\/strong> Roll 1 attack die. On a <span class=\"ic\">Focus<\/span> or <span class=\"ic\">Hit<\/span> result, remove this card.","u":1},"Scrambled":{"t":"When attacking a ship at Range 1 that is equipped with the \"Targeting Scrambler\" upgrade, you cannot modify your attack dice.<br><br>At the end of the Combat phase, remove this card.","u":1},"Optimized Prototype":{"t":"Increase your shield value by 1.<br><br>Once per round, when performing a primary weapon attack, you may spend 1 die result to remove 1 shield from the defender.<br><br>After you perform a primary weapon attack, a friendly ship at Range 1-2 equipped with the \"Director Krennic\" Upgrade card may acquire a target lock on the defender.","u":1}},"waves":{"0":"2015-09-04","1":"2012-09-14","2":"2013-02-28","3":"2013-09-12","4":"2014-06-26","5":"2014-11-26","6":"2015-02-26","7":"2015-08-25","8":"2016-03-17","9":"2016-09-22","10":"2017-02-02","11":"2017-07-13","12":"2017-12-08","13":"2017-12-08","14":"2018-06-21"}};
</script>
<script>
"use strict";
const P = new Map(DATA.pilots.map(p => [p.i, p]));
const U = new Map(DATA.upgrades.map(u => [u.i, u]));
const SHIPS = DATA.ships;
const FAC = { r: "Rebel", i: "Imperial", s: "Scum" };
const XWS_FAC = { r: "rebel", i: "imperial", s: "scum" };
const SLOT_NAME = { ept: "Elite", amd: "Astromech", samd: "Salvaged Astromech", mod: "Modification", crew: "Crew", title: "Title", system: "System", missile: "Missile", torpedo: "Torpedo", cannon: "Cannon", turret: "Turret", bomb: "Bomb", illicit: "Illicit", tech: "Tech", flex: "Cannon, Torpedo or Missile" };
const SLOT_ORDER = ["ept", "system", "tech", "amd", "samd", "crew", "turret", "cannon", "torpedo", "missile", "flex", "bomb", "illicit", "mod", "title"];
const STAT = { attack: "a", agility: "g", hull: "h", shields: "s" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const canon = n => n.replace(/\s*\((?:[+-]1|Attack|Closed|Landing|Recharging|Exhausted)\)$/, "").replace(/["“”]/g, "").toLowerCase();
const listable = u => !(u.dual && u.dual < u.i && u.x !== "adaptability");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

const blank = f => ({ name: "", f: f || "r", pts: 100, ships: [] });
let sq = sanitize(store.get("xwsb.current", null)) || blank("r");
let pool = store.get("xwsb.pool", "all");
let ui = { sheet: null, toast: null };
function save() { store.set("xwsb.current", sq); }
function sanitize(s) {
  if (!s || typeof s !== "object" || !FAC[s.f] || !Array.isArray(s.ships)) return null;
  return { name: String(s.name || "").slice(0, 80), f: s.f, pts: +s.pts > 0 ? Math.min(+s.pts, 1000) : 100,
    ships: s.ships.filter(x => x && P.has(x.p)).map(x => ({ p: x.p, u: (Array.isArray(x.u) ? x.u : []).filter(id => U.has(id)) })) };
}
const cutoff = () => pool === "all" ? "9999" : DATA.waves[pool];
const inPool = c => c.r <= cutoff();

function analyse(ship) {
  const p = P.get(ship.p), sh = SHIPS[p.s];
  const ups = ship.u.map(id => U.get(id));
  const has = x => ups.some(u => u.x === x);
  let slots = [...p.sl, "title", "mod"].map(t => ({ t }));
  const add = (t, by, extra) => slots.push(Object.assign({ t, by }, extra));
  ups.forEach(u => (u.gr || []).forEach(g => { if (g.type === "slot") add(g.name, u.n); }));
  ups.forEach(u => {
    if (u.x === "heavyscykinterceptor") add("flex", u.n, { acc: ["cannon", "torpedo", "missile"] });
    if (u.x === "os1arsenalloadout") { add("torpedo", u.n); add("missile", u.n); }
    if (u.x === "vaksai") { add("mod", u.n); add("mod", u.n); }
    if (u.x === "starvipermkii") add("title", u.n);
    if (u.x === "renegaderefit") add("mod", u.n);
    if (u.x === "smugglingcompartment") add("mod", u.n, { max: 3 });
  });
  const lose = (types, n) => { types.forEach(t => { let k = 0; slots = slots.filter(s => !(s.t === t && (n == null || k++ < n))); }); };
  if (has("tiex7")) lose(["cannon", "missile"]);
  if (has("tieshuttle")) lose(["torpedo", "missile", "bomb"]);
  if (has("havoc")) lose(["crew"], 1);
  if (has("lightscykinterceptor")) lose(["mod"]);
  slots.forEach(s => { s.acc = s.acc || [s.t]; });
  slots.sort((a, b) => SLOT_ORDER.indexOf(a.t) - SLOT_ORDER.indexOf(b.t) || (a.by ? 1 : 0) - (b.by ? 1 : 0));

  const base = p.ov ? { a: p.ov.attack, g: p.ov.agility, h: p.ov.hull, s: p.ov.shields } : { a: sh.a, g: sh.g, h: sh.h, s: sh.s };
  const st = Object.assign({}, base);
  let ps = p.ps; const actions = [...sh.act];
  ups.forEach(u => (u.gr || []).forEach(g => {
    if (g.type === "stats") { if (g.name === "skill") ps += g.value; else if (STAT[g.name]) st[STAT[g.name]] = (st[STAT[g.name]] ?? 0) + g.value; }
    if (g.type === "action" && !actions.includes(g.name)) actions.push(g.name);
  }));
  ups.forEach(u => { if (u.x === "adaptability") ps += u.n.includes("+1") ? 1 : -1; });

  const costs = ups.map(u => {
    let r = 0;
    if (has("tiex1") && u.sl === "system") r += 4;
    if (has("vaksai")) r += 1;
    if (has("renegaderefit") && u.sl === "ept") r += 1;
    return u.c > 0 ? Math.max(0, u.c - r) : u.c;
  });

  const need = ups.map(u => u.k || 1);
  const fits = (s, i) => s.acc.includes(ups[i].sl) && (s.max == null || costs[i] <= s.max);
  function solve(list) {
    const used = new Array(slots.length).fill(-1);
    const go = j => {
      if (j === list.length) return true;
      const i = list[j];
      const pick = (from, left) => {
        if (left === 0) return go(j + 1);
        for (let s = from; s < slots.length; s++) {
          if (used[s] === -1 && fits(slots[s], i)) { used[s] = i; if (pick(s + 1, left - 1)) return true; used[s] = -1; }
        }
        return false;
      };
      return pick(0, need[i]);
    };
    return go(0) ? used : null;
  }
  let placed = [], unplaced = [], fill = new Array(slots.length).fill(-1);
  ups.forEach((u, i) => { const r = solve([...placed, i]); if (r) { placed.push(i); fill = r; } else unplaced.push(i); });
  const total = p.c + costs.reduce((a, b) => a + b, 0);
  return { p, sh, ups, slots, fill, unplaced, st, base, ps, actions, costs, total };
}

function blockReason(u, a, si, opts = {}) {
  const p = a.p;
  if (u.f && u.f !== sq.f) return `${FAC[u.f]} only`;
  if (u.sh && !u.sh.includes(p.s)) return `${u.sh.map(x => SHIPS[x] ? SHIPS[x].n : x).join(", ")} only`;
  if (u.z && !u.z.includes(a.sh.z)) return `${u.z.map(z => z[0].toUpperCase() + z.slice(1)).join(" or ")} ship only`;
  switch (u.x) {
    case "autothrusters": if (!a.actions.includes("Boost")) return "Needs the Boost action"; break;
    case "longrangescanners": if (!a.slots.some(s => s.t === "torpedo") || !a.slots.some(s => s.t === "missile")) return "Needs Torpedo and Missile icons"; break;
    case "pulsedrayshield": if (a.st.s !== 1) return "Shield value must be 1"; break;
    case "thrustcorrector": if (a.st.h > 4) return "Hull value must be 4 or lower"; break;
    case "lightweightframe": if (a.st.g >= 3) return "Agility must be 2 or lower"; break;
    case "r2d6": if (a.ps <= 2) return "Pilot skill must be 3 or higher"; if (a.slots.some(s => s.t === "ept")) return "Already has an Elite icon"; break;
    case "royalguardtie": if (a.ps <= 4) return "Pilot skill must be 5 or higher"; break;
    case "virago": if (a.ps <= 3) return "Pilot skill must be 4 or higher"; break;
    case "blackone": if (a.ps <= 6) return "Pilot skill must be 7 or higher"; break;
    case "awingtestpilot": if (a.ps <= 1) return "Pilot skill must be 2 or higher"; break;
  }
  if (u.sl === "crew" && a.ups.some(x => x.x === "tieshuttle") && u.c > 4) return "TIE Shuttle: Crew costing 4 or less";
  if (u.sl === "samd" && !u.u && a.ups.some(x => x.x === "havoc")) return "Havoc: unique Salvaged Astromechs only";
  if (u.sl === "ept" && a.ups.some(x => x.x === "awingtestpilot") && a.ups.some(x => x.x === u.x)) return "A-wing Test Pilot: no duplicate Elite cards";
  if ((u.sl === "mod" || u.sl === "title") && a.ups.some(x => x.sl === u.sl && x.x === u.x)) return `Already equipped`;
  if (u.l && a.ups.some(x => x.x === u.x)) return "Limited: one per ship";
  if (u.u) {
    const c = canon(u.n);
    const where = usedUnique(c, si, opts.skipUp);
    if (where) return `Unique: already on ${where}`;
  }
  if (u.sq) {
    const n = sq.ships.reduce((k, s, i) => k + s.u.filter((id, j) => U.get(id).x === u.x && !(i === si && j === opts.skipUp)).length, 0);
    if (n >= u.sq) return `Squad limit ${u.sq}`;
  }
  return "";
}
function usedUnique(c, si, skipUp, skipPilot) {
  for (let i = 0; i < sq.ships.length; i++) {
    const s = sq.ships[i], p = P.get(s.p);
    if (p.u && canon(p.n) === c && !(i === si && skipPilot)) return i === si ? "this pilot" : p.n;
    for (let j = 0; j < s.u.length; j++) {
      if (i === si && j === skipUp) continue;
      const u = U.get(s.u[j]);
      if (u.u && canon(u.n) === c) return i === si ? "this ship" : p.n;
    }
  }
  return "";
}
function shipProblems(si) {
  const s = sq.ships[si], a = analyse(s), out = [];
  const p = a.p;
  if (p.f !== sq.f) out.push(`${p.n} is a ${FAC[p.f]} pilot`);
  if (p.u) { const w = usedUnique(canon(p.n), si, -1, true); if (w) out.push(`${p.n} is unique and also on ${w}`); }
  if (!inPool(p)) out.push(`${p.n} is outside the chosen card pool`);
  a.unplaced.forEach(i => out.push(`No free ${(a.ups[i].k || 1) > 1 ? a.ups[i].k + " " + SLOT_NAME[a.ups[i].sl] + " slots" : SLOT_NAME[a.ups[i].sl] + " slot"} for ${a.ups[i].n}`));
  a.ups.forEach((u, j) => {
    const without = analyse({ p: s.p, u: s.u.filter((_, k) => k !== j) });
    const r = blockReason(u, without, si, { skipUp: j });
    if (r) out.push(`${u.n}: ${r}`);
    if (!inPool(u)) out.push(`${u.n} is outside the chosen card pool`);
  });
  if (a.ups.some(u => u.x === "misthunter") && !a.ups.some(u => u.x === "tractorbeam")) out.push("Mist Hunter must also equip Tractor Beam");
  return { a, out: [...new Set(out)] };
}
function squadState() {
  const ships = sq.ships.map((_, i) => shipProblems(i));
  const total = ships.reduce((t, x) => t + x.a.total, 0);
  const top = [];
  if (total > sq.pts) top.push(`${total - sq.pts} points over the ${sq.pts}-point limit`);
  return { ships, total, top, bad: top.length + ships.reduce((n, x) => n + x.out.length, 0) };
}

const snap = () => JSON.parse(JSON.stringify(sq));
const words = q => q.toLowerCase().split(/\s+/).filter(Boolean);

function pilotSheet(s) {
  const target = s.ship;
  const pilots = DATA.pilots.filter(p => p.f === sq.f && inPool(p));
  const shipKeys = [...new Set(pilots.map(p => p.s))].sort((a, b) => SHIPS[a].n.localeCompare(SHIPS[b].n));
  const qw = words(s.q || "");
  let list = pilots.filter(p => (!s.shipf || p.s === s.shipf) && qw.every(w => (p.n + " " + SHIPS[p.s].n + " " + textOf(p.t)).toLowerCase().includes(w)));
  list.sort((a, b) => SHIPS[a.s].n.localeCompare(SHIPS[b.s].n) || b.ps - a.ps || b.c - a.c);

      <span class="tags">${p.sl.map(x => `<span>${esc(SLOT_NAME[x])}</span>`).join("")}${p.fn === "Resistance" || p.fn === "First Order" ? `<span>${esc(p.fn)}</span>` : ""}</span>
      ${p.t ? `<p>${p.t}</p>` : ""}${why ? `<span class="why">${esc(why)}</span>` : ""}</span><span class="oc">${p.c}</span></button>`;
  }).join("");

}
function upgradeSheet(s) {
  const ship = sq.ships[s.ship];
  const a0 = analyse(ship);
  const slot = a0.slots[s.slot];
  const occ = a0.fill[s.slot];
  const occId = occ >= 0 ? ship.u[occ] : null;
  const baseU = occ >= 0 ? ship.u.filter((_, j) => j !== occ) : ship.u.slice();
  const aBase = analyse({ p: ship.p, u: baseU });
  const qw = words(s.q || "");
  let hidden = 0;
  const cands = DATA.upgrades.filter(u => listable(u) && inPool(u) && slot.acc.includes(u.sl) && qw.every(w => (u.n + " " + textOf(u.t)).toLowerCase().includes(w)));
  const opts = cands.map(u => {
    const trial = { p: ship.p, u: [...baseU, u.i] };
    const at = analyse(trial);
    let why = blockReason(u, aBase, s.ship, { skipUp: occ >= 0 ? occ : -1 });
    if (!why && at.unplaced.includes(at.ups.length - 1)) why = (u.k || 1) > 1 ? `Needs ${u.k} ${SLOT_NAME[u.sl]} slots` : (slot.max != null ? `Costs more than ${slot.max}` : "No room");
    return { u, why, cost: at.costs[at.ups.length - 1] };
  }).sort((x, y) => (!!x.why - !!y.why) || (x.u.i === occId ? -1 : y.u.i === occId ? 1 : 0) || x.cost - y.cost || x.u.n.localeCompare(y.u.n));
  const rows = opts.map(o => {
    if (o.why && !s.all && o.u.i !== occId) { hidden++; return ""; }
    const u = o.u;
    const tags = [u.sl !== slot.t ? SLOT_NAME[u.sl] : "", u.l ? "Limited" : "", u.sq ? `Max ${u.sq} per squad` : "", u.k > 1 ? `Uses ${u.k} slots` : "", u.atk != null ? `Attack ${u.atk}${u.rng ? " · Range " + u.rng : ""}` : "", u.sh ? u.sh.map(x => SHIPS[x].n).join(", ") : "", u.f ? FAC[u.f] : "", u.z ? u.z.join("/") : ""].filter(Boolean);
    return `<button type="button" class="opt${o.why ? " no" : ""}${u.i === occId ? " cur" : ""}" ${o.why ? 'aria-disabled="true"' : `data-chooseu="${u.i}"`} style="grid-template-columns:minmax(0,1fr) auto">
      <span class="on"><b>${u.u ? '<span class="uniq">•</span>' : ""}${esc(u.n)}${u.i === occId ? " · equipped" : ""}</b>${tags.length ? `<span class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join("")}</span>` : ""}
      <p>${u.t}</p>${o.why ? `<span class="why">${esc(o.why)}</span>` : ""}</span><span class="oc">${o.cost !== u.c ? `<s style="opacity:.6">${u.c}</s> ` : ""}${o.cost}</span></button>`;
  }).join("");
  const head = `<input type="search" id="sheetq" data-autofocus placeholder="Search ${esc(SLOT_NAME[slot.t])} cards…" value="${esc(s.q || "")}" autocomplete="off" aria-label="Search cards">`;
  const any = opts.length - hidden > 0;
  const body = (any ? rows : `<div class="empty" style="margin:14px">${opts.length ? "Every card that fits this slot is blocked on this ship." : "No cards match."}</div>`) + (hidden ? `<button type="button" class="more" data-showall>Show ${hidden} unavailable</button>` : "");
  const foot = occId != null ? `<button type="button" class="btn" data-rm="${s.ship}:${occ}" data-closeafter>Empty this slot</button>` : "";
  return sheetFrame(SLOT_NAME[slot.t], `${esc(a0.p.n)} · ${esc(a0.sh.n)}${slot.max != null ? ` · ${slot.max} points or less` : ""}`, head, body, foot);
}

const PDF_LIBS = ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"];
let libsP = null;
function loadLibs() {

  libsP = libsP || Promise.all(PDF_LIBS.map(src => new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("lib")); document.head.appendChild(s);
  }))).catch(e => { libsP = null; throw e; });

}
const pdfText = s => String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/•/g, "*").replace(/[^\x20-\x7e\xa0-\xff]/g, "").trim();
async function buildPDF(progress) {
  await loadLibs();
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const S = squadState();
  const ships = shipTiles(S);
  const host = document.createElement("div");
  host.className = "pdfhost"; host.dataset.f = sq.f;
  host.innerHTML = ships.map((sh, i) => sh.tiles.map((t, k) => `<div class="pdftile" data-s="${i}" data-k="${k}">${t}</div>`).join("")).join("");
  document.body.appendChild(host);
  try {
    fitCardText(host);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const W = 210, H = 297, M = 12, GAP = 4, COLS = 3;
    const tw = (W - 2 * M - GAP * (COLS - 1)) / COLS, th = tw * 1.25, bottom = H - 9;
    let y = M;
    doc.setFont("helvetica", "bold"); doc.setFontSize(18);
    doc.text(pdfText(sq.name || "Unnamed squad").toUpperCase() || "SQUAD", M, y + 6);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90, 104, 118);
    doc.text(`${FAC[sq.f]} - ${S.total}/${sq.pts} points - ${sq.ships.length} ship${sq.ships.length === 1 ? "" : "s"}`, M, y + 12);
    y += 20;
    const els = [...host.querySelectorAll(".pdftile")];
    let done = 0;
    for (let si = 0; si < ships.length; si++) {
      const { a } = ships[si];
      if (si > 0) { doc.addPage(); y = M; }
      doc.setDrawColor(214, 220, 227); doc.line(M, y, W - M, y);
      doc.setTextColor(24, 33, 43); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
      doc.text(pdfText(a.p.n).toUpperCase(), M, y + 5.5);
      const nw = doc.getTextWidth(pdfText(a.p.n).toUpperCase());
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(90, 104, 118);
      doc.text(pdfText(a.sh.n), M + nw + 3, y + 5.5);
      doc.text(`Ship total ${a.total} pts`, W - M, y + 5.5, { align: "right" });
      y += 9;
      const mine = els.filter(e => +e.dataset.s === si);
      for (let k = 0; k < mine.length; k++) {

    for (let i = 1; i <= n; i++) {

    }

}
const pdfName = () => (pdfText(sq.name).replace(/[^\w\-' ]+/g, " ").trim().replace(/\s+/g, " ") || "squad") + " - cards and dials.pdf";
async function offerFile(blob, filename) {
  let dl = null;
  if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; } }

const b36 = n => n.toString(36);
function shareHash() {
  const hex = Array.from(new TextEncoder().encode(sq.name.slice(0, 40))).map(b => b.toString(16).padStart(2, "0")).join("");
  return "sq-" + sq.f + b36(sq.pts) + (sq.ships.length ? "-" + sq.ships.map(s => [s.p, ...s.u].map(b36).join("X")).join("-") : "") + (hex ? "-N" + hex : "");
}
function parseShare(h) {
  const m = /^#?sq-([ris])([0-9a-z]+)((?:-[0-9a-zX]+)*)(?:-N([0-9a-f]*))?$/.exec(h);
  if (!m) return null;
  let name = "";
  if (m[4]) { try { name = new TextDecoder().decode(new Uint8Array(m[4].match(/../g).map(x => parseInt(x, 16)))); } catch (e) {} }
  const ships = m[3].split("-").filter(Boolean).map(b => { const ids = b.split("X").map(x => parseInt(x, 36)); return { p: ids[0], u: ids.slice(1) }; });
  return sanitize({ name, f: m[1], pts: parseInt(m[2], 36), ships });
}
function shareURL() { return location.href.replace(/#.*$/, "") + "#" + shareHash(); }
function toXWS() {
  const S = squadState();
  return JSON.stringify({
    name: sq.name || "Unnamed squad", faction: XWS_FAC[sq.f], points: S.total, version: "0.3.0",
    pilots: sq.ships.map((s, i) => {
      const a = S.ships[i].a, ups = {};
      a.ups.forEach(u => (ups[u.sl] = ups[u.sl] || []).push(u.x));
      return Object.assign({ name: a.p.x, ship: a.p.s, points: a.total }, Object.keys(ups).length ? { upgrades: ups } : {});
    }),
    vendor: { xwsquadbuilder: { builder: "X-Wing Squad Builder (Claude)", link: shareURL() } }
  }, null, 2);
}
function toText() {
  const S = squadState();
  const lines = [`${sq.name || "Unnamed squad"} — ${FAC[sq.f]}, ${S.total}/${sq.pts}`, ""];
  sq.ships.forEach((s, i) => {
    const a = S.ships[i].a;
    lines.push(`${a.p.n} (${a.p.c}) — ${a.sh.n}`);
    a.ups.forEach((u, j) => lines.push(`  + ${u.n} (${a.costs[j]})`));
    lines.push(`  Ship total: ${a.total}`, "");
  });
  lines.push(`Total: ${S.total}`);
  return lines.join("\n");
}
function fromXWS(txt) {
  let j; try { j = JSON.parse(txt); } catch (e) { return { err: "That isn't valid JSON, an XWS list, or a squad link." }; }
  const f = { rebel: "r", imperial: "i", scum: "s" }[String(j.faction || "").toLowerCase()];
  if (!f || !Array.isArray(j.pilots)) return { err: "That JSON doesn't look like an XWS squad (it needs a faction and pilots)." };
  const miss = [], ships = [];
  j.pilots.forEach(pp => {
    const p = DATA.pilots.find(x => x.x === pp.name && x.s === pp.ship && x.f === f) || DATA.pilots.find(x => x.x === pp.name && x.s === pp.ship);
    if (!p) { miss.push(`pilot ${pp.name} (${pp.ship})`); return; }
    const u = [];
    Object.entries(pp.upgrades || {}).forEach(([slot, list]) => (Array.isArray(list) ? list : []).forEach(x => {
      const c = DATA.upgrades.filter(v => v.sl === slot && v.x === x);
      const pick = c.find(v => v.n.includes("(+1)")) || c.find(listable) || c[0];
      if (pick) u.push(pick.i); else miss.push(`${slot} ${x}`);
    }));
    ships.push({ p: p.i, u });

}
function exportSheet(s) {

document.addEventListener("click", e => {
  const t = e.target;
  const on = sel => t.closest(sel);
  let el;
  if ((el = on(".tabs button"))) { setView(el.dataset.v); return; }
  if ((el = on(".fac button"))) {
    const f = el.dataset.f;
    if (f === sq.f) return;
    const before = snap();
    if (sq.ships.length) { sq.ships = []; sq.f = f; commit(); toast(`Switched to ${FAC[f]}; ships cleared`, before); }
    else { sq.f = f; commit(); }
    return;
  }
  if ((el = on("[data-act]"))) {
    const k = el.dataset.act;
    if (k === "new") { if (!sq.ships.length && !sq.name) return; const before = snap(); sq = blank(sq.f); commit(); toast("Started a new squad", before); }
    else openSheet({ kind: k });
    return;
  }
  if (on("[data-undo]")) { if (ui.toast && ui.toast.undo) { sq = ui.toast.undo; ui.toast = null; commit(); } return; }
  if (on("[data-close]") || (t.matches && t.matches("[data-scrim]"))) { closeSheet(); return; }
  if (on("#addship")) { openSheet({ kind: "pilot", ship: null, shipf: "" }); return; }
  if ((el = on("[data-pilot]"))) { const i = +el.dataset.pilot; openSheet({ kind: "pilot", ship: i, shipf: P.get(sq.ships[i].p).s }); return; }
  if ((el = on("[data-shipf]"))) { ui.sheet.shipf = el.dataset.shipf; renderLayer(); $("#sheetbody").scrollTop = 0; return; }
  if ((el = on("[data-showall]"))) { ui.sheet.all = true; ui.sheet.keepScroll = true; renderLayer(); return; }
  if ((el = on("[data-choosep]"))) {
    const pid = +el.dataset.choosep, s = ui.sheet;
    if (s.ship == null) { sq.ships.push({ p: pid, u: [] }); closeSheet(); commit(); requestAnimationFrame(() => { const c = document.querySelectorAll(".shipc"); if (c.length) c[c.length - 1].scrollIntoView({ block: "nearest" }); }); }
    else {
      const old = sq.ships[s.ship];
      const keep = P.get(old.p).s === P.get(pid).s;
      const before = snap();
      sq.ships[s.ship] = { p: pid, u: keep ? old.u : [] };
      closeSheet(); commit();
      if (!keep && old.u.length) toast("Different ship: upgrades removed", before);
    }
    return;
  }
  if ((el = on("[data-rm]"))) {
    e.stopPropagation();

    if (el.hasAttribute("data-closeafter")) ui.sheet = null;
    commit(); return;
  }
  if ((el = on("[data-slot]"))) { const [si, k] = el.dataset.slot.split(":").map(Number); openSheet({ kind: "upgrade", ship: si, slot: k }); return; }
  if ((el = on("[data-chooseu]"))) {
    const s = ui.sheet, ship = sq.ships[s.ship], a = analyse(ship), occ = a.fill[s.slot];
    if (occ >= 0) ship.u.splice(occ, 1, +el.dataset.chooseu); else ship.u.push(+el.dataset.chooseu);
    closeSheet(); commit(); return;
  }
  if ((el = on("[data-dup]"))) {
    const i = +el.dataset.dup, s = sq.ships[i];
    sq.ships.splice(i + 1, 0, { p: s.p, u: s.u.slice() }); commit();
    if (P.get(s.p).u) toast("Copied — it's a unique pilot, so change one of them");
    return;
  }
  if ((el = on("[data-up]"))) { const i = +el.dataset.up; [sq.ships[i - 1], sq.ships[i]] = [sq.ships[i], sq.ships[i - 1]]; commit(); return; }
  if ((el = on("[data-del]"))) { const before = snap(); const n = P.get(sq.ships[+el.dataset.del].p).n; sq.ships.splice(+el.dataset.del, 1); commit(); toast(`Removed ${n}`, before); return; }
  if ((el = on("[data-etab]"))) { ui.sheet.tab = el.dataset.etab; ui.sheet.msg = ""; ui.sheet.bad = false; renderLayer(); return; }

    const s = ui.sheet; if (s.busy) return;
    s.busy = true; s.bad = false; s.msg = "Loading the PDF tools…"; renderLayer();
    const upd = (m, bad) => { if (ui.sheet === s) { s.msg = m; s.bad = !!bad; renderLayer(); } };
    buildPDF((i, n) => upd(`Drawing card ${i} of ${n}…`))
      .then(blob => { upd("Your PDF is ready — confirm the download."); return offerFile(blob, pdfName()); })
      .then(r => upd(r === "saved" ? "PDF saved." : "PDF download started."))
      .catch(err => {
        const c = err && err.code;
        if (c === "declined") upd("Download cancelled.");
        else if (c === "rate_limited") upd("A download prompt is already open. Try again in a moment.", true);
        else if (err && err.message === "lib") upd("Couldn't load the PDF tools. Check your connection and try again.", true);
        else upd("Couldn't save a PDF here. " + (err && err.message ? err.message : ""), true);

      .finally(() => { s.busy = false; if (ui.sheet === s) renderLayer(); });
    return;
  }
  if (on("[data-copy]")) {
    const v = $("#exptext").value;
    const done = ok => { ui.sheet.msg = ok ? "Copied." : "Couldn't copy automatically — the text is selected, so copy it yourself."; renderLayer(); if (!ok) { $("#exptext").focus(); $("#exptext").select(); } };
    try { navigator.clipboard.writeText(v).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    return;

    const before = snap(); sq = res.sq; ui.sheet = null; commit();

    const i = list.findIndex(x => x.sq && x.sq.name && x.sq.name === sq.name && sq.name);
    const entry = { sq: snap(), at: Date.now() };

    renderLayer(); return;
  }
  if ((el = on("[data-load]"))) {
    const x = store.get("xwsb.saved", [])[+el.dataset.load];
    const t = x && sanitize(x.sq);
    if (t) { const before = snap(); sq = t; ui.sheet = null; commit(); toast(`Opened ${t.name || "squad"}`, before); }
    return;
  }
  if ((el = on("[data-delsave]"))) {
    const list = store.get("xwsb.saved", []); list.splice(+el.dataset.delsave, 1); store.set("xwsb.saved", list);
    ui.sheet.msg = "Deleted."; renderLayer(); return;
  }
});
